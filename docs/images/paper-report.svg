<rect width="1440" height="820" fill="#ffffff"/>
<text x="220" y="44" class="h" text-anchor="middle">① 만들기: 턴이 끝난 뒤 백그라운드</text>
<text x="710" y="44" class="h" text-anchor="middle">② 저장: 논문 요약 리포트</text>
<text x="1205" y="44" class="h" text-anchor="middle">③ 읽기: 다음 질문</text>
<rect x="40" y="66" width="360" height="84" rx="14" fill="#e7f0fb" stroke="#6f9bd1" stroke-width="1.5"/>
<g transform="translate(62,88)" fill="none" stroke="#6f9bd1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h13l7 7v22H7z"/><path d="M20 2v7h7"/><path d="M11 15h12M11 20h12M11 25h8"/></g>
<text x="236" y="100" class="t" text-anchor="middle">논문 원문</text>
<text x="236" y="120" class="s" text-anchor="middle">main.tex와 \input 파일, 저장 전 수정 포함</text>
<path d="M220 150 V184" class="p" marker-end="url(#ap)"/>
<text x="232" y="172" class="lp" text-anchor="start">파서가 섹션으로 나눔</text>
<rect x="40" y="188" width="360" height="176" rx="14" fill="#eef4fc" stroke="#6f9bd1" stroke-width="1.5"/>
<text x="220" y="214" class="t" text-anchor="middle">섹션 단위</text>
<text x="220" y="232" class="s" text-anchor="middle">섹션 본문의 해시가 요약을 찾는 열쇠</text>
<rect x="56" y="244" width="328" height="106" rx="8" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/>
<text x="70" y="266" class="k">front</text>
<text x="116" y="266" class="kt">Title and abstract</text>
<text x="370" y="266" class="kh" text-anchor="end">항상 원문</text>
<text x="70" y="285" class="k">1</text>
<text x="116" y="285" class="kt">Introduction</text>
<text x="370" y="285" class="kh" text-anchor="end">#a3f07d…</text>
<text x="70" y="304" class="k">3.2</text>
<text x="116" y="304" class="kt">Uncertainty Estimation</text>
<text x="370" y="304" class="kh" text-anchor="end">#4be19c…</text>
<text x="70" y="323" class="k">3.3</text>
<text x="116" y="323" class="kt">Temporal Routing</text>
<text x="370" y="323" class="kh" text-anchor="end">#77d2e0…</text>
<text x="70" y="342" class="k">…</text>
<text x="116" y="342" class="kt"></text>
<text x="370" y="342" class="kh" text-anchor="end"></text>
<path d="M220 364 V398" class="f" marker-end="url(#a)"/>
<text x="232" y="386" class="la" text-anchor="start">요약이 없는 섹션만</text>
<rect x="40" y="402" width="360" height="104" rx="14" fill="#e6f4ee" stroke="#4ea37f" stroke-width="1.5"/>
<g transform="translate(62,424)" fill="none" stroke="#4ea37f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h20v20H6z"/><path d="M10 12h12M10 17h12M10 22h7"/></g>
<text x="236" y="432" class="t" text-anchor="middle">Section Summary Module</text>
<text x="236" y="452" class="s" text-anchor="middle">gpt-6.1-sol (low), 약 4만 자씩 묶어 호출</text>
<text x="236" y="470" class="s" text-anchor="middle">논문의 언어로 섹션마다 2~4문장: 주장, 방법, 데이터, 수치</text>
<text x="236" y="488" class="s" text-anchor="middle">단어가 아주 적은 섹션은 본문을 그대로 요약으로</text>
<rect x="500" y="66" width="420" height="440" rx="14" fill="#fdf6e0" stroke="#c9ad4f" stroke-width="1.5"/>
<g transform="translate(522,80)" fill="none" stroke="#c9ad4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="11" ry="4"/><path d="M5 7v18c0 2 5 4 11 4s11-2 11-4V7"/><path d="M5 16c0 2 5 4 11 4s11-2 11-4"/></g>
<text x="726" y="100" class="t" text-anchor="middle">논문 요약 리포트  report.json</text>
<text x="726" y="120" class="s" text-anchor="middle">프로젝트마다 하나, 그 프로젝트의 모든 채팅 세션이 함께 씀</text>
<rect x="516" y="134" width="388" height="226" rx="8" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/>
<text x="530" y="154.0" class="k">{</text>
<text x="530" y="171.6" class="k">  "version": 1,</text>
<text x="530" y="189.2" class="k">  "summaries": {</text>
<text x="530" y="206.8" class="k">    "4be19c27a0d3e1": {</text>
<text x="530" y="224.4" class="k">      "title": "Uncertainty Estimation",</text>
<text x="530" y="242.0" class="k">      "summary": "Predicts a mean and variance per</text>
<text x="530" y="259.6" class="k">                  joint, trained with NLL (eq:nll).",</text>
<text x="530" y="277.20000000000005" class="k">      "updatedAt": 1761040000000</text>
<text x="530" y="294.8" class="k">    },</text>
<text x="530" y="312.4" class="k">    "a3f07d5e91c0b2": { "title": "Introduction", … },</text>
<text x="530" y="330.0" class="k">    …</text>
<text x="530" y="347.6" class="k">  }</text>
<text x="518" y="382" class="sl">• 키는 섹션 번호가 아니라 섹션 본문의 해시입니다.</text>
<text x="518" y="401" class="sl">   섹션이 밀려 번호가 바뀌어도 요약을 그대로 씁니다.</text>
<text x="518" y="420" class="sl">• 본문을 한 글자라도 고치면 키가 바뀌어 요약이 없는</text>
<text x="518" y="439" class="sl">   섹션이 되고, 다음 턴이 끝나면 그 섹션만 다시 요약합니다.</text>
<text x="518" y="458" class="sl">• 지금 논문에 없는 섹션의 요약은 최근 200개만 남깁니다.</text>
<text x="518" y="477" class="sl">• 위치: &lt;app local data&gt;/papers/&lt;프로젝트 ID&gt;/report.json</text>
<path d="M400 300 H496" class="m" marker-end="url(#am)"/>
