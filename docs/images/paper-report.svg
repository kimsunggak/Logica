<text x="1205" y="96" class="t" text-anchor="middle">판단 (Chat Orchestrator)</text>
<text x="1205" y="114" class="s" text-anchor="middle">논문 지도를 보고 갈래와 원문으로 읽을 섹션을 고름</text>
<rect x="1024" y="126" width="362" height="122" rx="8" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/>
<text x="1036" y="146.0" class="k">&lt;paper_map summaries="16/16"&gt;</text>
<text x="1036" y="163.6" class="k">[front] Title and abstract: always read word for word</text>
<text x="1036" y="181.2" class="k">  [3.2] Uncertainty Estimation (30 words):</text>
<text x="1036" y="198.8" class="k">        Predicts a mean and variance per… | eq:nll</text>
<text x="1036" y="216.4" class="k">&lt;/paper_map&gt;</text>
<text x="1036" y="234.0" class="k">→ answer_question({ sections: ["3.2"] })</text>
<path d="M1205 262 V296" class="f" marker-end="url(#a)"/>
<text x="1217" y="284" class="la" text-anchor="start">sections (Refine이 바꿀 수 있음)</text>
<rect x="1010" y="300" width="390" height="206" rx="14" fill="#fdf0e6" stroke="#d88a52" stroke-width="1.5"/>
<text x="1205" y="330" class="t" text-anchor="middle">Refine / Answer</text>
<text x="1205" y="348" class="s" text-anchor="middle">고른 섹션과 초록은 원문, 나머지 섹션은 요약</text>
<rect x="1024" y="360" width="362" height="132" rx="8" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/>
<text x="1036" y="380.0" class="k">&lt;section key="front" content="full"&gt;</text>
<text x="1036" y="397.6" class="k">&lt;section key="3.2" content="full"&gt;</text>
<text x="1036" y="415.2" class="k">  &lt;source file="sections/method.tex" lines="9-18"&gt;</text>
<text x="1036" y="432.8" class="k">&lt;section key="3.3" content="summary"&gt;</text>
<text x="1036" y="450.4" class="k">요약만 받은 섹션이 더 필요하면</text>
<text x="1036" y="468.0" class="k">[[need_sections: 4.3]] → 그 섹션을 원문으로 한 번 더</text>
