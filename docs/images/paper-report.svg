<path d="M920 430 H1006" class="m" marker-end="url(#am)"/>
<text x="963" y="420" class="lm" text-anchor="middle">나머지 요약</text>
<text x="40" y="562" class="h">어떤 논문을 보내는가</text>
<rect x="40" y="578" width="325" height="150" rx="12" fill="#f6f7f9" stroke="#c4cad6" stroke-width="1.5"/>
<text x="58" y="606" class="ch">리포트에 요약이 없음</text>
<text x="347" y="606" class="ct" text-anchor="end">이 논문으로 하는 첫 대화</text>
<line x1="58" y1="618" x2="347" y2="618" stroke="#dfe3ea"/>
<text x="58" y="644" class="sl">원문 전체를 파일 단위로 보냄</text>
<text x="58" y="666" class="sl">(지금까지와 같음, 최대 150,000자)</text>
<text x="58" y="688" class="sl">턴이 끝나면 모든 섹션을 요약해 저장</text>
<rect x="385" y="578" width="325" height="150" rx="12" fill="#f6f7f9" stroke="#c4cad6" stroke-width="1.5"/>
<text x="403" y="606" class="ch">요약이 있음</text>
<text x="692" y="606" class="ct" text-anchor="end">두 번째 대화부터</text>
<line x1="403" y1="618" x2="692" y2="618" stroke="#dfe3ea"/>
<text x="403" y="644" class="sl">초록과 판단이 고른 섹션은 원문</text>
<text x="403" y="666" class="sl">섹션을 고르면 그 하위 절도 원문</text>
<text x="403" y="688" class="sl">나머지 섹션은 리포트의 요약</text>
<rect x="730" y="578" width="325" height="150" rx="12" fill="#f6f7f9" stroke="#c4cad6" stroke-width="1.5"/>
<text x="748" y="606" class="ch">섹션을 고친 직후</text>
<text x="1037" y="606" class="ct" text-anchor="end">본문 해시가 바뀜</text>
<line x1="748" y1="618" x2="1037" y2="618" stroke="#dfe3ea"/>
<text x="748" y="644" class="sl">요약이 없는 섹션은 자동으로 원문</text>
<text x="748" y="666" class="sl">턴이 끝나면 그 섹션만 다시 요약</text>
<text x="748" y="688" class="sl">다른 섹션의 요약은 그대로</text>
<rect x="1075" y="578" width="325" height="150" rx="12" fill="#f6f7f9" stroke="#c4cad6" stroke-width="1.5"/>
<text x="1093" y="606" class="ch">sections: ["all"]</text>
<text x="1382" y="606" class="ct" text-anchor="end">전체가 필요한 질문</text>
<line x1="1093" y1="618" x2="1382" y2="618" stroke="#dfe3ea"/>
<text x="1093" y="644" class="sl">용어 통일, 전체 검토, 섹션 간 비교</text>
<text x="1093" y="666" class="sl">원문 전체를 파일 단위로 보냄</text>
