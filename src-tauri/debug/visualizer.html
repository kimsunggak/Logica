<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGICA Runtime Debugger</title>
<style>
/* Layout: 왼쪽 실행 목록, 가운데 실행 그래프와 타임라인, 오른쪽 데이터 인스펙터 */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #18202e; --ink-2: #5a6578; --line: #d8dee8; --soft: #eef1f6;
  --run: #1f6feb; --run-soft: #e3edff; --ok: #1a7f4b; --ok-soft: #e1f4ea; --err: #c4302b; --err-soft: #fde7e6;
  --wait: #9aa4b5; --llm: #8250df; --llm-soft: #f1eafe;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "D2Coding", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1218; --panel: #151b24; --ink: #e5e9f0; --ink-2: #9aa5b8; --line: #2a3342; --soft: #1c2430;
    --run: #5b9dff; --run-soft: #17284a; --ok: #49c483; --ok-soft: #14301f; --err: #ff7b72; --err-soft: #3a1918;
    --wait: #5e6a7d; --llm: #b48cff; --llm-soft: #271d3d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .01em; }
header .sub { color: var(--ink-2); font-size: 12px; }
.pill { font: 11px/1 var(--mono); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); }
.pill.on { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.pill.off { color: var(--err); border-color: var(--err); background: var(--err-soft); }
.spacer { flex: 1; }
.ctl { display: flex; gap: 8px; align-items: center; }
.ctl label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }

/* Panes: sizes are CSS variables the gutters change (see "layout" in the script). */
.app { --left: 250px; --right: 420px; --graph-h: 62%; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left) 6px minmax(0, 1fr) 6px var(--right); }
.app.no-traces { --left: 34px; } .app.no-inspector { --right: 34px; }
@media (max-width: 1100px) {
  .app { grid-template-columns: var(--left) 6px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .gutter.right { display: none; }
  .inspector { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
}
.col { min-height: 0; overflow: auto; }
.pane-head { display: flex; align-items: center; gap: 6px; padding-right: 8px; }
.pane-head .section-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn { border: 1px solid var(--line); background: var(--soft); border-radius: 5px; min-width: 26px; height: 24px; padding: 0 6px; cursor: pointer; font: 600 12px/1 var(--mono); color: var(--ink); }
.pbtn:hover { border-color: var(--ink-2); }
.pbtn.wide { min-width: 52px; }
.collapsed > :not(.pane-head) { display: none; }
.collapsed .pane-head .section-title { display: none; }
.collapsed .pane-head { flex-direction: column; padding: 8px 4px; }
.gutter { background: transparent; position: relative; touch-action: none; }
.gutter::after { content: ""; position: absolute; border-radius: 2px; background: var(--line); }
.gutter.v { cursor: col-resize; } .gutter.v::after { top: 50%; left: 2px; width: 2px; height: 36px; margin-top: -18px; }
.gutter.h { cursor: row-resize; height: 6px; flex: none; } .gutter.h::after { left: 50%; top: 2px; height: 2px; width: 36px; margin-left: -18px; }
.gutter:hover, .gutter.drag, .gutter:focus-visible { background: var(--run-soft); } .gutter:hover::after, .gutter.drag::after { background: var(--run); }
.gutter.off { pointer-events: none; } .gutter.off::after { display: none; }
/* A pane shown over the whole window (⤢); Esc or ⤢ again puts it back. */
.maxed { position: fixed !important; inset: 0; z-index: 40; height: auto !important; max-height: none !important; background: var(--panel); border: 0 !important; }
.traces { border-right: 1px solid var(--line); background: var(--panel); }
.inspector { border-left: 1px solid var(--line); background: var(--panel); }
.section-title { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 12px 14px 8px; }

.trace { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 14px; cursor: pointer; }
.trace:hover { background: var(--soft); }
.trace.sel { background: var(--run-soft); box-shadow: inset 3px 0 0 var(--run); }
.trace .q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.trace .m { display: flex; gap: 8px; color: var(--ink-2); font: 11px var(--mono); margin-top: 2px; }
.empty { color: var(--ink-2); padding: 14px; }

.center { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
/* A saved height larger than the window still leaves the timeline its 80px. */
.graph-pane { height: var(--graph-h); min-height: 140px; max-height: calc(100% - 86px); display: flex; flex-direction: column; flex: none; }
.graph-pane.maxed { display: flex; }
.zoom { display: flex; gap: 4px; align-items: center; }
.graph-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
.graph-wrap.panning { cursor: grabbing; }
.graph-wrap.panning .node { cursor: grabbing; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
svg text { font-family: var(--sans); fill: var(--ink); }
.node rect { fill: var(--panel); stroke: var(--wait); stroke-width: 1.5; }
.node.waiting rect { stroke-dasharray: 4 3; }
.node.running rect { stroke: var(--run); stroke-width: 2.5; fill: var(--run-soft); }
.node.completed rect { stroke: var(--ok); stroke-width: 2; }
.node.error rect { stroke: var(--err); stroke-width: 2.5; fill: var(--err-soft); }
.node.llm rect { stroke: var(--llm); }
.node.llm.running rect { fill: var(--llm-soft); stroke: var(--llm); }
.node.sel rect { stroke-width: 3.5; }
.node.skipped { opacity: .45; }
.node.skipped rect { stroke-dasharray: 2 4; }
.node .route { font: 600 11px var(--mono); fill: var(--llm); }
.node { cursor: pointer; }
.node .title { font-size: 14px; font-weight: 600; }
.node .meta { font: 11px var(--mono); fill: var(--ink-2); }
.node .fn { font: 11px var(--mono); fill: var(--ink-2); }
.node .fn.running { fill: var(--run); } .node .fn.error { fill: var(--err); } .node .fn.completed { fill: var(--ok); }
.node.running rect { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.edge { fill: none; stroke: var(--wait); stroke-width: 1.6; }
.edge.done { stroke: var(--ok); }
.edge.active { stroke: var(--run); stroke-width: 2.2; stroke-dasharray: 6 5; animation: flow .7s linear infinite; }
.edge.call { stroke-dasharray: 3 4; }
.edge.skip { stroke-dasharray: 2 5; opacity: .35; }
.edge.call.active { stroke: var(--llm); stroke-dasharray: 6 5; }
@keyframes flow { to { stroke-dashoffset: -11; } }
@media (prefers-reduced-motion: reduce) { .node.running rect, .edge.active { animation: none; } }
.elabel { font: 10.5px var(--mono); fill: var(--ink-2); }
.ah { fill: var(--wait); } .ah.done { fill: var(--ok); } .ah.active { fill: var(--run); }

.timeline { flex: 1; min-height: 80px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; align-items: flex-end; }
.tabs .spacer { flex: 1; } .tabs .pbtn { margin-bottom: 4px; }
.tab { border: 1px solid var(--line); border-bottom: none; background: var(--soft); border-radius: 6px 6px 0 0; padding: 4px 10px; cursor: pointer; color: var(--ink-2); }
.tab.on { background: var(--panel); color: var(--ink); font-weight: 600; }
.tl-body { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 96px 70px minmax(160px, 260px) minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 12px; font: 11.5px var(--mono); cursor: pointer; border-bottom: 1px solid var(--soft); }
.row:hover { background: var(--soft); }
.row.sel { background: var(--run-soft); }
.row .fnname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { position: relative; height: 12px; }
.bar { position: absolute; top: 1px; height: 10px; border-radius: 3px; min-width: 3px; background: var(--ok); }
.bar.running { background: var(--run); } .bar.error { background: var(--err); } .bar.llm { background: var(--llm); }
.dim { color: var(--ink-2); }
.log { display: grid; grid-template-columns: 96px 64px 64px 60px minmax(140px, 220px) 90px minmax(0, 1fr); gap: 8px; padding: 3px 12px; font: 11.5px var(--mono); border-bottom: 1px solid var(--soft); cursor: pointer; }
.log:hover { background: var(--soft); }
.ev-start { color: var(--run); } .ev-end { color: var(--ok); } .ev-error { color: var(--err); } .ev-data { color: var(--llm); }

.badge { font: 10.5px/1 var(--mono); padding: 2px 6px; border-radius: 4px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.badge.running { background: var(--run-soft); color: var(--run); } .badge.completed { background: var(--ok-soft); color: var(--ok); } .badge.error { background: var(--err-soft); color: var(--err); }
.badge.rust { background: var(--llm-soft); color: var(--llm); }

.insp-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.insp-head h2 { margin: 0; font-size: 15px; }
.span { border-bottom: 1px solid var(--line); padding: 10px 14px; }
.span.sel { background: color-mix(in srgb, var(--run-soft) 55%, transparent); }
.span-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.span-h .fnname { font: 600 12.5px var(--mono); }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 8px; margin: 8px 0 4px; font: 11.5px var(--mono); }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.blk { margin-top: 8px; }
.blk > .lbl { font: 600 11px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.blk.next > .lbl { color: var(--ok); }
pre.val { margin: 0; padding: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.more { border: 0; background: none; color: var(--run); padding: 2px 0; cursor: pointer; font-size: 11.5px; }
/* Full-window viewer for one long value (a prompt, an answer). */
.viewer { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 20, .45); display: flex; padding: 32px; }
.viewer[hidden] { display: none; }
.viewer-box { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.viewer-head { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.viewer-head b { flex: 1; font: 600 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer pre { flex: 1; margin: 0; padding: 14px; overflow: auto; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; color: var(--ink-2); font-size: 11.5px; padding: 0 12px 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 2px solid; }
</style>
</head>
<body>
<header>
  <h1>LOGICA Runtime Debugger</h1>
  <span class="sub">npm run tauri dev 로 실행 중인 앱의 채팅 한 턴이 어떤 갈래로 처리되는지 실시간으로 봅니다</span>
  <span class="spacer"></span>
  <span id="conn" class="pill off">연결 대기</span>
  <div class="ctl">
    <label><input type="checkbox" id="follow" checked> 최신 실행 따라가기</label>
    <button class="btn" id="clear" type="button">지우기</button>
  </div>
</header>
<div class="app" id="app">
  <aside class="col traces" id="paneTraces">
    <div class="pane-head"><div class="section-title">실행 (질문 1개 = trace 1개)</div><button class="pbtn" type="button" data-collapse="traces" title="접기">«</button></div>
    <div id="traceList"><div class="empty">앱에서 질문하면 여기에 나타납니다.</div></div>
  </aside>
  <div class="gutter v left" data-gutter="left" role="separator" aria-orientation="vertical" aria-label="실행 목록 너비" tabindex="0" title="드래그로 너비 조절, 더블클릭으로 기본값"></div>
  <main class="center" id="center">
  <section class="graph-pane" id="paneGraph">
    <div class="pane-head">
      <div class="section-title">Execution Graph</div>
      <div class="zoom">
        <button class="pbtn" type="button" data-zoom="out" title="축소 (-)">−</button>
        <button class="pbtn wide" type="button" data-zoom="actual" id="zoomLevel" title="100%로">100%</button>
        <button class="pbtn" type="button" data-zoom="in" title="확대 (+)">+</button>
        <button class="pbtn wide" type="button" data-zoom="fit" title="전체가 보이게 (0, 더블클릭)">맞춤</button>
        <button class="pbtn" type="button" data-max="paneGraph" title="화면 전체로 (Esc로 복귀)">⤢</button>
      </div>
    </div>
    <div class="graph-wrap" id="graphWrap" title="휠: 확대/축소, 드래그: 이동, 더블클릭: 맞춤"><svg id="graph" viewBox="0 0 840 680" role="img" aria-label="User Input, Chat Orchestrator, 그 아래 나란히 Reply, Answer, Refine Module, Final Answer 실행 그래프와 LLM 호출"></svg></div>
    <div class="legend">
      <span><i style="border-color:var(--wait);border-style:dashed"></i>waiting</span>
      <span><i style="border-color:var(--run);background:var(--run-soft)"></i>running</span>
      <span><i style="border-color:var(--ok)"></i>completed</span>
      <span><i style="border-color:var(--err);background:var(--err-soft)"></i>error</span>
      <span><i style="border-color:var(--wait);border-style:dotted;opacity:.5"></i>skipped (이 갈래에서 건너뜀)</span>
      <span><i style="border-color:var(--llm)"></i>LLM 호출 (Gateway + Rust)</span>
    </div>
  </section>
    <div class="gutter h" data-gutter="graph" role="separator" aria-orientation="horizontal" aria-label="그래프 높이" tabindex="0" title="드래그로 높이 조절, 더블클릭으로 기본값"></div>
    <section class="timeline" id="paneTimeline">
      <div class="tabs">
        <button class="tab on" data-tab="calls" type="button">함수 호출 순서</button>
        <button class="tab" data-tab="log" type="button">이벤트 로그</button>
        <span class="spacer"></span>
        <button class="pbtn" type="button" data-max="paneTimeline" title="화면 전체로 (Esc로 복귀)">⤢</button>
      </div>
      <div class="tl-body" id="timeline"></div>
    </section>
  </main>
  <div class="gutter v right" data-gutter="right" role="separator" aria-orientation="vertical" aria-label="인스펙터 너비" tabindex="0" title="드래그로 너비 조절, 더블클릭으로 기본값"></div>
  <aside class="col inspector" id="paneInspector">
    <div class="pane-head">
      <div class="section-title">Data Inspector</div>
      <button class="pbtn" type="button" data-max="paneInspector" title="화면 전체로 (Esc로 복귀)">⤢</button>
      <button class="pbtn" type="button" data-collapse="inspector" title="접기">»</button>
    </div>
    <div id="inspector"></div>
  </aside>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-box">
    <div class="viewer-head"><b id="viewerTitle"></b><button class="btn" type="button" id="viewerCopy">복사</button><button class="btn" type="button" id="viewerClose">닫기 (Esc)</button></div>
    <pre id="viewerBody"></pre>
  </div>
</div>
<script>
"use strict";
const MODULES = {
  user:         { title: "👤 User Input" },
  orchestrator: { title: "Chat Orchestrator" },
  reply:        { title: "Reply Module" },
  refine:       { title: "Refine Module" },
  answer:       { title: "Answer Module" },
  final:        { title: "💬 Final Answer" },
  llm:          { title: "LLM Gateway" },
  summary:      { title: "Summary Module" },
};
// The modules of a turn; a turn runs through some of them (its route).
const CHAIN = ["user", "orchestrator", "reply", "answer", "refine", "final"];
// Top-level span of each module: its output is what the module hands on.
const MAIN_FN = { user: "receiveUserInput", orchestrator: "runOrchestrator", reply: "runReplyModule", refine: "runRefineModule", answer: "runAnswerModule", final: "showFinalAnswer", summary: "runSummaryModule" };
const ROUTE_LABEL = { reply: "A reply_directly", answer: "B answer_question", refine: "C refine_question", clarify: "C refine_question → 되묻기" };
const PREVIEW = 1500;

let traces = new Map();   // trace_id -> trace
let seen = new Set();     // seq numbers of this connection
let clearedAt = 0;
let selTrace = null, selModule = "orchestrator", selSpan = null, tab = "calls";
const expanded = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n, w = 2) => String(n).padStart(w, "0");
const clock = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`; };
const fmtMs = (ms) => ms == null ? "" : ms >= 1000 ? `${(ms / 1000).toFixed(2)}s` : `${Math.round(ms)}ms`;

function trace(id) {
  let t = traces.get(id);
  if (!t) { t = { id, spans: new Map(), order: [], events: [], start: Infinity, end: 0, question: "" }; traces.set(id, t); }
  return t;
}

function apply(ev) {
  if (!ev.trace_id || (ev.timestamp || 0) < clearedAt) return;
  const t = trace(ev.trace_id);
  t.events.push(ev);
  t.start = Math.min(t.start, ev.timestamp);
  t.end = Math.max(t.end, ev.timestamp);
  let s = t.spans.get(ev.span_id);
  if (!s) {
    s = { id: ev.span_id, parent: null, module: ev.module, fn: ev.function, source: ev.source, status: "running", start: ev.timestamp, end: null, data: [], children: [] };
    t.spans.set(ev.span_id, s);
    t.order.push(ev.span_id);
  }
  if (ev.event_type === "span_start") {
    Object.assign(s, { parent: ev.parent_id || null, caller: ev.caller, module: ev.module, fn: ev.function, source: ev.source, start: ev.timestamp, input: ev.input, request_id: ev.request_id });
    if (s.parent) { const p = t.spans.get(s.parent); if (p && !p.children.includes(s.id)) p.children.push(s.id); }
    if (!s.parent && ev.input && ev.input.question) t.question = ev.input.question;
  } else if (ev.event_type === "span_data") {
    s.data.push({ label: ev.data && ev.data.label, value: ev.data && ev.data.value, ts: ev.timestamp });
  } else if (ev.event_type === "span_end" || ev.event_type === "span_error") {
    s.status = ev.status || (ev.event_type === "span_end" ? "completed" : "error");
    s.end = ev.timestamp; s.duration = ev.duration_ms; s.output = ev.output; s.error = ev.error;
  }
  // A session summary runs right after a turn; following it would hide the turn just watched.
  if (followLatest() && !s.parent && ev.event_type === "span_start" && ev.module !== "summary") { selTrace = ev.trace_id; selSpan = null; selModule = "orchestrator"; }
  if (!selTrace) { selTrace = ev.trace_id; if (ev.module === "summary") selModule = "summary"; }
}

const followLatest = () => $("follow").checked;

function rootOf(t) { return t.order.map((id) => t.spans.get(id)).find((s) => !s.parent); }
/** A Summary Module run (its own trace, after a turn) rather than a chat turn. */
function isSummary(t) { const root = t && rootOf(t); return Boolean(root && root.module === "summary"); }
function spansOf(t, module) { return t.order.map((id) => t.spans.get(id)).filter((s) => s.module === module); }
function depth(t, s) { let d = 0, p = s.parent; while (p && t.spans.get(p)) { d++; p = t.spans.get(p).parent; } return d; }
function mainSpan(t, module) { return spansOf(t, module).find((s) => s.fn === MAIN_FN[module]); }
/** The route the judge chose, and the modules the turn runs through. */
function routeOf(t) {
  const orch = t && mainSpan(t, "orchestrator");
  const route = orch && orch.output && orch.output.route;
  if (!route) return null;
  const refine = mainSpan(t, "refine");
  const clarify = Boolean(refine && refine.output && refine.output.kind === "clarify");
  const path = route === "reply" ? ["user", "orchestrator", "reply", "final"]
    : route === "answer" ? ["user", "orchestrator", "answer", "final"]
    : clarify ? ["user", "orchestrator", "refine", "final"] : ["user", "orchestrator", "refine", "answer", "final"];
  return { route, clarify, path, reason: orch.output.reason, reasonIssue: orch.output.reason_issue };
}
/** Model calls: a failed attempt that Claude took over does not make the call fail. */
function llmStatus(t) {
  const attempts = spansOf(t, "llm").filter((s) => s.fn === "aiService.generate");
  if (!attempts.length) return "waiting";
  const last = new Map();
  for (const s of attempts) last.set(s.parent, s);
  const ends = [...last.values()];
  if (ends.some((s) => s.status === "running")) return "running";
  if (ends.some((s) => s.status === "error")) return "error";
  return "completed";
}
function moduleStatus(t, module) {
  if (module === "llm") return llmStatus(t);
  const list = spansOf(t, module);
  const r = routeOf(t);
  if (!list.length && r && !r.path.includes(module)) return "skipped";
  if (!list.length) return "waiting";
  if (list.some((s) => s.status === "error")) return "error";
  if (list.some((s) => s.status === "running")) return "running";
  return "completed";
}
function moduleDuration(t, module) {
  const main = spansOf(t, module).filter((s) => module === "llm" ? s.fn === "aiService.generate" : s.fn === MAIN_FN[module]);
  if (!main.length) return null;
  return main.reduce((n, s) => n + (s.duration != null ? s.duration : (s.end || Date.now()) - s.start), 0);
}

// ------------------------------------------------------------ render

function render() {
  renderTraces();
  const t = traces.get(selTrace);
  // A different run starts fitted; within a run the view the user set stays.
  if (t?.id !== viewedTrace) { viewedTrace = t?.id; zoom.fitted = true; }
  renderGraph(t);
  applyView();
  renderTimeline(t);
  renderInspector(t);
}

function renderTraces() {
  const list = [...traces.values()].sort((a, b) => b.start - a.start);
  if (!list.length) { $("traceList").innerHTML = '<div class="empty">앱에서 질문하면 여기에 나타납니다.</div>'; return; }
  $("traceList").innerHTML = list.map((t) => {
    const root = rootOf(t);
    const status = root ? root.status : "running";
    const dur = root && root.duration != null ? fmtMs(root.duration) : status === "running" ? "…" : "";
    return `<button type="button" class="trace ${t.id === selTrace ? "sel" : ""}" data-trace="${esc(t.id)}">
      <span class="q">${esc(t.question || t.id)}</span>
      <span class="m"><span>${clock(t.start)}</span><span class="badge ${status}">${status}</span>${isSummary(t) ? '<span class="badge rust">요약</span>' : ""}<span>${dur}</span></span></button>`;
  }).join("");
}

/** What a node lists: function calls, or for the LLM node one line per model call. */
function nodeLines(t, module) {
  const fns = t ? spansOf(t, module) : [];
  const time = (s) => s.duration != null ? "  " + fmtMs(s.duration) : s.status === "running" ? "  …" : "";
  if (module === "llm") {
    return fns.filter((s) => s.source !== "rust" && (s.fn === "aiService.generate" || s.fn === "fallback")).map((s) => ({
      status: s.status,
      text: s.fn === "fallback"
        ? `↪ fallback → ${s.output && s.output.model ? s.output.model : "skipped"}`
        : `${(s.input && s.input.task) || ""}  ${(s.input && s.input.model) || ""}${time(s)}`,
    }));
  }
  const lines = fns.map((s) => ({ status: s.status, text: (s.source === "rust" ? "rust  " : "") + s.fn + time(s) }));
  const main = t && mainSpan(t, module);
  if (module === "summary" && main && main.output) {
    lines.unshift({ status: "route", text: `턴 1~${main.output.covered_turns} 요약됨, 변경 ${main.output.ops}개, 무시 ${main.output.ignored}개` });
  }
  // What the call reads of the conversation: the summary (L1) and the turns word for word (L2).
  const judgeCall = module === "orchestrator" && t && spansOf(t, "llm").find((s) => s.fn === "aiService.generate" && s.input && s.input.task === "judge");
  const history = judgeCall ? judgeCall.input : main && main.input;
  if (history && Array.isArray(history.turn_numbers)) {
    const turns = history.turn_numbers;
    const orchestrator = mainSpan(t, "orchestrator");
    const covered = orchestrator && orchestrator.input && orchestrator.input.summary_covered_turns;
    const reads = `${covered ? `요약 턴 1~${covered}` : "요약 없음"} + 원문 ${turns.length ? `턴 ${turns.join(", ")}` : "없음"}`;
    lines.unshift({ status: history.clipped ? "error" : "route", text: reads + (history.clipped ? `  (${history.clipped.length}개 메시지 잘림)` : "") });
  }
  const r = module === "orchestrator" && routeOf(t);
  if (r) {
    if (r.reasonIssue) lines.unshift({ status: "error", text: r.reasonIssue === "arguments_unreadable" ? "⚠ 툴 인자 파싱 실패 (reason 없음)" : "⚠ reason 비어 있음" });
    lines.unshift({ status: "route", text: "갈래 " + ROUTE_LABEL[r.clarify ? "clarify" : r.route] });
  }
  return lines;
}

/** The border already shows a completed step, so it shows only its time. */
function statusText(status, dur) {
  const time = dur != null ? fmtMs(dur) : "";
  return status === "completed" ? time : `${status}${time ? "  " + time : ""}`;
}

function nodeSvg(t, module, x, y, w, h) {
  const status = t ? moduleStatus(t, module) : "waiting";
  const dur = t ? moduleDuration(t, module) : null;
  const max = Math.floor((h - 40) / 14);
  const lines = nodeLines(t, module).slice(0, max).map((l, i) =>
    `<text class="${l.status === "route" ? "route" : "fn " + l.status}" x="${x + 12}" y="${y + 50 + i * 14}">${esc(l.text)}</text>`).join("");
  const empty = status === "waiting" ? "아직 실행 안 됨" : status === "skipped" ? "이 갈래에서는 건너뜀" : "";
  return `<g class="node ${status} ${module === "llm" ? "llm" : ""} ${selModule === module ? "sel" : ""}" data-module="${module}" tabindex="0" role="button" aria-label="${esc(MODULES[module].title)} ${status}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
    <text class="title" x="${x + 12}" y="${y + 22}">${esc(MODULES[module].title)}</text>
    <text class="meta" x="${x + w - 12}" y="${y + 22}" text-anchor="end">${statusText(status, dur)}</text>
    <line x1="${x + 12}" y1="${y + 32}" x2="${x + w - 12}" y2="${y + 32}" stroke="var(--line)"></line>
    ${lines || `<text class="fn" x="${x + 12}" y="${y + 50}">${empty}</text>`}
  </g>`;
}

function edgeClass(t, from, to) {
  if (!t) return "";
  const a = moduleStatus(t, from), b = moduleStatus(t, to);
  if (b === "running") return "active";
  if (a === "completed" && b !== "waiting") return "done";
  return "";
}

/** Arrowheads for the three edge states; a skipped edge fades with its path. */
const MARKERS = `<defs>${["", "done", "active"].map((c) =>
  `<marker id="ah-${c || "wait"}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ${c}" d="M0,0 L10,5 L0,10 z"></path></marker>`).join("")}</defs>`;
const edgeSvg = (c, d, label, lx, ly) =>
  `<path class="edge ${c}" d="${d}" marker-end="url(#ah-${c === "done" || c === "active" ? c : "wait"})"></path>` +
  (label ? `<text class="elabel" x="${lx}" y="${ly}">${esc(label)}</text>` : "");

/**
 * The LLM Gateway as a bar under the graph: every model call of the turn in
 * order (judge, then the module calls), with the fallbacks between them.
 */
function gatewaySvg(t, x, y, w) {
  const status = t ? moduleStatus(t, "llm") : "waiting";
  const dur = t ? moduleDuration(t, "llm") : null;
  const CIRCLED = "①②③④⑤⑥⑦⑧⑨";
  let n = 0;
  const items = nodeLines(t, "llm").map((l) => ({ ...l, text: l.text.startsWith("↪") ? l.text : `${CIRCLED[n++] || "•"} ${l.text}` }));
  // Monospace at 11px is about 6.7px a character; wrap the calls to fit the bar.
  const rows = [[]];
  let used = 0;
  for (const it of items) {
    const width = it.text.length * 6.7 + 18;
    if (used + width > w - 24 && rows.at(-1).length) { rows.push([]); used = 0; }
    rows.at(-1).push({ ...it, x: x + 12 + used });
    used += width;
  }
  const h = 40 + Math.max(1, rows.length) * 15;
  const lines = items.length
    ? rows.flatMap((row, i) => row.map((it) => `<text class="fn ${it.status}" x="${it.x}" y="${y + 50 + i * 15}">${esc(it.text)}</text>`)).join("")
    : `<text class="fn" x="${x + 12}" y="${y + 50}">아직 호출 없음</text>`;
  return { h, svg: `<g class="node ${status} llm ${selModule === "llm" ? "sel" : ""}" data-module="llm" tabindex="0" role="button" aria-label="LLM Gateway ${status}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"></rect>
    <text class="title" x="${x + 12}" y="${y + 22}">${esc(MODULES.llm.title)}</text>
    <text class="meta" x="${x + w - 12}" y="${y + 22}" text-anchor="end">${statusText(status, dur)}</text>
    <line x1="${x + 12}" y1="${y + 32}" x2="${x + w - 12}" y2="${y + 32}" stroke="var(--line)"></line>
    ${lines}</g>` };
}

/** A Summary Module run: the module and the model calls it makes. */
function renderSummaryGraph(t) {
  const X = 20, W = 800;
  const bar = gatewaySvg(t, X, 190, W);
  graphSize(840, 190 + bar.h + 12);
  $("graph").innerHTML = [
    MARKERS,
    nodeSvg(t, "summary", 300, 20, 240, 130),
    edgeSvg(spansOf(t, "llm").length ? "done" : "", "M420 150 V186"),
    bar.svg,
  ].join("");
}

/**
 * One turn, top to bottom. The judge hands the turn to one of three modules,
 * so they sit side by side; only the Refine Module goes on to another one
 * (the Answer Module, beside it). The model calls are listed in the bar below.
 */
function renderGraph(t) {
  if (isSummary(t)) return renderSummaryGraph(t);
  const W = 240, COL = { reply: 20, answer: 300, refine: 580 };
  const Y = { user: 10, orchestrator: 126, branch: 300, final: 486 };
  const H = { user: 84, orchestrator: 102, branch: 116, final: 76 };
  const at = {
    user: [COL.answer, Y.user, H.user],
    orchestrator: [COL.answer, Y.orchestrator, H.orchestrator],
    reply: [COL.reply, Y.branch, H.branch],
    answer: [COL.answer, Y.branch, H.branch],
    refine: [COL.refine, Y.branch, H.branch],
    final: [COL.answer, Y.final, H.final],
  };
  const r = routeOf(t);
  // An edge is on the turn's path when the route goes straight from one module to the other.
  const cls = (from, to) => {
    if (!r) return edgeClass(t, from, to);
    const i = r.path.indexOf(from);
    return i >= 0 && r.path[i + 1] === to ? edgeClass(t, from, to) : "skip";
  };
  const mid = (m) => at[m][0] + W / 2;
  const top = (m) => at[m][1];
  const bottom = (m) => at[m][1] + at[m][2];
  const oBottom = bottom("orchestrator"), bTop = top("answer"), bBottom = bottom("answer"), fTop = top("final");
  const edges = [
    edgeSvg(cls("user", "orchestrator"), `M${mid("user")} ${bottom("user")} V${top("orchestrator") - 2}`, "question + open file", mid("user") + 10, (bottom("user") + top("orchestrator")) / 2 + 4),
    edgeSvg(cls("orchestrator", "reply"), `M${mid("orchestrator") - 70} ${oBottom} C${mid("orchestrator") - 70} ${oBottom + 40}, ${mid("reply")} ${bTop - 44}, ${mid("reply")} ${bTop - 2}`, "A reply_directly", mid("reply") + 20, oBottom + 34),
    edgeSvg(cls("orchestrator", "answer"), `M${mid("orchestrator")} ${oBottom} V${bTop - 2}`, "B answer_question", mid("answer") + 10, oBottom + 44),
    edgeSvg(cls("orchestrator", "refine"), `M${mid("orchestrator") + 70} ${oBottom} C${mid("orchestrator") + 70} ${oBottom + 40}, ${mid("refine")} ${bTop - 44}, ${mid("refine")} ${bTop - 2}`, "C refine_question", mid("refine") - 70, oBottom + 34),
    edgeSvg(cls("refine", "answer"), `M${COL.refine} ${bTop + H.branch / 2} H${COL.answer + W + 2}`),
    // The gap between the two is narrow; the label goes on two lines above the arrow.
    `<text class="elabel" x="${COL.answer + W + 20}" y="${bTop + H.branch / 2 - 22}" text-anchor="middle">정제된</text>`,
    `<text class="elabel" x="${COL.answer + W + 20}" y="${bTop + H.branch / 2 - 9}" text-anchor="middle">질문</text>`,
    edgeSvg(cls("reply", "final"), `M${mid("reply")} ${bBottom} C${mid("reply")} ${bBottom + 44}, ${mid("final") - 60} ${fTop - 40}, ${mid("final") - 60} ${fTop - 2}`),
    edgeSvg(cls("answer", "final"), `M${mid("answer")} ${bBottom} V${fTop - 2}`, "answer (streamed)", mid("answer") + 10, (bBottom + fTop) / 2 + 4),
    edgeSvg(cls("refine", "final"), `M${mid("refine")} ${bBottom} C${mid("refine")} ${bBottom + 44}, ${mid("final") + 60} ${fTop - 40}, ${mid("final") + 60} ${fTop - 2}`, "되묻기", mid("refine") - 60, bBottom + 22),
  ];
  const bar = gatewaySvg(t, 20, bottom("final") + 24, 800);
  graphSize(840, bottom("final") + 24 + bar.h + 8);
  $("graph").innerHTML = [
    MARKERS,
    ...edges,
    ...CHAIN.map((m) => nodeSvg(t, m, at[m][0], at[m][1], W, at[m][2])),
    bar.svg,
  ].join("");
}

function renderTimeline(t) {
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  if (!t) { $("timeline").innerHTML = '<div class="empty">선택된 실행이 없습니다.</div>'; return; }
  const now = Date.now();
  const span0 = t.start, total = Math.max(1, Math.max(t.end, ...[...t.spans.values()].map((s) => s.end || (s.status === "running" ? now : s.start))) - span0);
  if (tab === "calls") {
    $("timeline").innerHTML = t.order.map((id) => {
      const s = t.spans.get(id);
      const d = depth(t, s);
      const end = s.end || (s.status === "running" ? now : s.start);
      const left = ((s.start - span0) / total) * 100, width = Math.max(0.4, ((end - s.start) / total) * 100);
      return `<div class="row ${selSpan === id ? "sel" : ""}" data-span="${esc(id)}" data-module="${esc(s.module)}">
        <span class="dim">${clock(s.start)}</span>
        <span class="badge ${s.status}">${s.status}</span>
        <span class="fnname" style="padding-left:${d * 14}px" title="${esc(s.caller ? s.caller + " → " + s.fn : s.fn)}">${d ? "↳ " : ""}${esc(s.fn)}${s.source === "rust" ? ' <span class="badge rust">rust</span>' : ""}</span>
        <span class="bar-track"><span class="bar ${s.status} ${s.module === "llm" && s.status === "completed" ? "llm" : ""}" style="left:${left}%;width:${width}%"></span></span>
      </div>`;
    }).join("");
  } else {
    $("timeline").innerHTML = [...t.events].sort((a, b) => a.timestamp - b.timestamp || a.seq - b.seq).map((ev) => {
      const cls = ev.event_type === "span_start" ? "ev-start" : ev.event_type === "span_end" ? "ev-end" : ev.event_type === "span_error" ? "ev-error" : "ev-data";
      return `<div class="log" data-span="${esc(ev.span_id)}" data-module="${esc(ev.module)}">
        <span>${clock(ev.timestamp)}</span><span class="dim">+${ev.timestamp - span0}ms</span><span class="dim">${esc(ev.source || "")}</span>
        <span>${esc(ev.module || "")}</span><span class="fnname">${esc(ev.function || "")}</span><span class="${cls}">${esc(ev.event_type)}</span>
        <span class="dim">${ev.duration_ms != null ? fmtMs(ev.duration_ms) : ev.data ? esc(ev.data.label) : ev.error ? esc(ev.error) : ""}</span></div>`;
    }).join("");
  }
}

/** Values the inspector shows, for the full-window viewer. */
const shown = new Map();

function valueHtml(key, value, label = "") {
  if (value === undefined) return '<pre class="val dim">(없음)</pre>';
  const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  const long = text.length > PREVIEW && !expanded.has(key);
  shown.set(key, { text, label });
  const big = text.length > 300 ? `<button class="more" type="button" data-view="${esc(key)}">크게 보기</button>` : "";
  return `<pre class="val">${esc(long ? text.slice(0, PREVIEW) + "…" : text)}</pre>` +
    (long ? `<button class="more" type="button" data-expand="${esc(key)}">전체 ${text.length.toLocaleString()}자 보기</button> ` : "") + big;
}

function renderInspector(t) {
  const box = $("inspector");
  shown.clear();
  if (!t) { box.innerHTML = '<div class="empty">노드를 누르면 입력, 중간값, 출력을 봅니다.</div>'; return; }
  const status = moduleStatus(t, selModule);
  const list = spansOf(t, selModule);
  const head = `<div class="insp-head"><h2>${esc(MODULES[selModule].title)}</h2><span class="badge ${status}">${status}</span>
    <span class="dim">${list.length}개 함수 호출</span></div>`;
  if (!list.length) { box.innerHTML = head + '<div class="empty">이 단계는 아직 실행되지 않았습니다.</div>'; return; }
  box.innerHTML = head + list.map((s) => {
    const callees = s.children.map((c) => t.spans.get(c)).filter(Boolean).map((c) => c.fn);
    const main = s.fn === MAIN_FN[selModule];
    const r = routeOf(t);
    const path = r ? r.path : ["user", "orchestrator"];
    const after = path.includes(selModule) ? path[path.indexOf(selModule) + 1] : null;
    const next = main && after && MODULES[after].title;
    const data = s.data.map((d, i) => `<div class="blk"><div class="lbl">중간값: ${esc(d.label)} <span class="dim">${clock(d.ts)}</span></div>${valueHtml(s.id + ":d" + i, d.value, `${s.fn}: ${d.label}`)}</div>`).join("");
    return `<div class="span ${selSpan === s.id ? "sel" : ""}" id="span-${esc(s.id)}">
      <div class="span-h"><span class="fnname">${esc(s.fn)}</span><span class="badge ${s.status}">${s.status}</span>${s.source === "rust" ? '<span class="badge rust">rust</span>' : '<span class="badge">webview</span>'}</div>
      <dl class="kv">
        <dt>caller</dt><dd>${esc(s.caller || (s.parent && t.spans.get(s.parent) ? t.spans.get(s.parent).fn : "(없음)"))}</dd>
        <dt>callee</dt><dd>${esc(callees.join(", ") || "(없음)")}</dd>
        <dt>시작</dt><dd>${clock(s.start)}</dd>
        <dt>종료</dt><dd>${s.end ? clock(s.end) : "실행 중"}</dd>
        <dt>실행 시간</dt><dd>${s.duration != null ? fmtMs(s.duration) : "…"}</dd>
        ${s.request_id ? `<dt>request</dt><dd>${esc(s.request_id)}</dd>` : ""}
      </dl>
      <div class="blk"><div class="lbl">Input</div>${valueHtml(s.id + ":in", s.input, `${s.fn}: input`)}</div>
      ${data}
      ${s.error ? `<div class="blk"><div class="lbl" style="color:var(--err)">Error</div>${valueHtml(s.id + ":err", s.error, `${s.fn}: error`)}</div>` : ""}
      ${s.output !== undefined || s.status === "completed" ? `<div class="blk ${next ? "next" : ""}"><div class="lbl">${next ? `Output → ${esc(next)} 로 전달` : "Output"}</div>${valueHtml(s.id + ":out", s.output, `${s.fn}: output`)}</div>` : ""}
    </div>`;
  }).join("");
  if (selSpan) document.getElementById("span-" + selSpan)?.scrollIntoView({ block: "nearest" });
}

// ------------------------------------------------------------ zoom and pan

/**
 * The graph's view: `k` screen pixels per graph unit, (x, y) the graph point
 * at the top left. Rendering sets the graph's size; while `fitted`, the view
 * follows it so a growing graph stays in sight.
 */
const zoom = { x: 0, y: 0, k: 1, fitted: true, w: 840, h: 680, dragged: false };
let viewedTrace;
const K_MIN = 0.2, K_MAX = 4;

function graphSize(w, h) { zoom.w = w; zoom.h = h; }

function fitView() {
  const box = $("graphWrap").getBoundingClientRect();
  if (!box.width || !box.height) return;
  const k = Math.min(box.width / zoom.w, box.height / zoom.h) * 0.96;
  zoom.k = Math.min(Math.max(k, K_MIN), 1.6);
  zoom.x = (zoom.w - box.width / zoom.k) / 2;
  zoom.y = (zoom.h - box.height / zoom.k) / 2;
}

function applyView() {
  const box = $("graphWrap").getBoundingClientRect();
  if (!box.width || !box.height) return;
  if (zoom.fitted) fitView();
  $("graph").setAttribute("viewBox", `${zoom.x} ${zoom.y} ${box.width / zoom.k} ${box.height / zoom.k}`);
  $("zoomLevel").textContent = `${Math.round(zoom.k * 100)}%`;
}

/** Zoom by `factor` keeping the graph point under (px, py) (pixels in the pane) where it is. */
function zoomAt(factor, px, py) {
  const k = Math.min(Math.max(zoom.k * factor, K_MIN), K_MAX);
  zoom.x += px / zoom.k - px / k;
  zoom.y += py / zoom.k - py / k;
  zoom.k = k;
  zoom.fitted = false;
  applyView();
}

function zoomBy(how) {
  const box = $("graphWrap").getBoundingClientRect();
  if (how === "fit") { zoom.fitted = true; applyView(); return; }
  if (how === "actual") { zoomAt(1 / zoom.k, box.width / 2, box.height / 2); return; }
  zoomAt(how === "in" ? 1.25 : 0.8, box.width / 2, box.height / 2);
}

(() => {
  const wrap = $("graphWrap");
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const box = wrap.getBoundingClientRect();
    // Pixel deltas from a trackpad are small and many; line deltas from a wheel are few.
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(Math.exp(-dy * 0.0015), e.clientX - box.left, e.clientY - box.top);
  }, { passive: false });
  let start = null;
  wrap.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    start = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x: zoom.x, y: zoom.y, moving: false };
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.cx, dy = e.clientY - start.cy;
    // Below 4px it is a click on a node, not a pan.
    if (!start.moving && Math.hypot(dx, dy) < 4) return;
    if (!start.moving) { start.moving = true; wrap.setPointerCapture(e.pointerId); wrap.classList.add("panning"); }
    zoom.x = start.x - dx / zoom.k;
    zoom.y = start.y - dy / zoom.k;
    zoom.fitted = false;
    applyView();
  });
  const end = (e) => {
    if (!start || e.pointerId !== start.id) return;
    if (start.moving) { zoom.dragged = true; wrap.classList.remove("panning"); setTimeout(() => { zoom.dragged = false; }, 0); }
    start = null;
  };
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
  wrap.addEventListener("dblclick", () => zoomBy("fit"));
  new ResizeObserver(() => applyView()).observe(wrap);
})();

// ------------------------------------------------------------ layout

/** Pane sizes, collapsed panes and the pane shown over the window; sizes are kept in the browser. */
const LAYOUT_KEY = "logica-debugger-layout";
const DEFAULTS = { left: 250, right: 420, graph: null };
const layout = { left: DEFAULTS.left, right: DEFAULTS.right, graph: DEFAULTS.graph, collapsed: { traces: false, inspector: false }, max: null };
try {
  const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
  for (const k of ["left", "right", "graph"]) if (typeof saved[k] === "number") layout[k] = saved[k];
  if (saved.collapsed) Object.assign(layout.collapsed, saved.collapsed);
} catch { /* no saved layout */ }

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify({ left: layout.left, right: layout.right, graph: layout.graph, collapsed: layout.collapsed })); } catch { /* storage unavailable */ }
}

function applyLayout() {
  const app = $("app");
  app.style.setProperty("--left", `${layout.left}px`);
  app.style.setProperty("--right", `${layout.right}px`);
  app.style.setProperty("--graph-h", layout.graph == null ? "62%" : `${layout.graph}px`);
  app.classList.toggle("no-traces", layout.collapsed.traces);
  app.classList.toggle("no-inspector", layout.collapsed.inspector);
  $("paneTraces").classList.toggle("collapsed", layout.collapsed.traces);
  $("paneInspector").classList.toggle("collapsed", layout.collapsed.inspector);
  document.querySelector('[data-collapse="traces"]').textContent = layout.collapsed.traces ? "»" : "«";
  document.querySelector('[data-collapse="traces"]').title = layout.collapsed.traces ? "펼치기" : "접기";
  document.querySelector('[data-collapse="inspector"]').textContent = layout.collapsed.inspector ? "«" : "»";
  document.querySelector('[data-collapse="inspector"]').title = layout.collapsed.inspector ? "펼치기" : "접기";
  document.querySelector('[data-gutter="left"]').classList.toggle("off", layout.collapsed.traces);
  document.querySelector('[data-gutter="right"]').classList.toggle("off", layout.collapsed.inspector);
}

function toggleCollapse(pane) {
  layout.collapsed[pane] = !layout.collapsed[pane];
  applyLayout();
  saveLayout();
}

function toggleMax(id) {
  const was = layout.max;
  if (was) $(was).classList.remove("maxed");
  layout.max = was === id ? null : id;
  if (layout.max) $(layout.max).classList.add("maxed");
  document.querySelectorAll("[data-max]").forEach((b) => { b.textContent = b.dataset.max === layout.max ? "✕" : "⤢"; b.title = b.dataset.max === layout.max ? "원래 크기로 (Esc)" : "화면 전체로 (Esc로 복귀)"; });
  if (layout.max === "paneGraph" || was === "paneGraph") zoom.fitted = true;
  applyView();
}

/** Drag a gutter to resize the panes beside it; arrow keys move it by 20px, a double click resets it. */
(() => {
  const limits = {
    left: () => [160, Math.max(200, innerWidth * 0.45)],
    right: () => [260, Math.max(300, innerWidth * 0.6)],
    graph: () => [140, Math.max(160, $("center").getBoundingClientRect().height - 90)],
  };
  const clamp = (name, v) => { const [lo, hi] = limits[name](); return Math.round(Math.min(Math.max(v, lo), hi)); };
  const current = (name) => name === "graph" ? $("paneGraph").getBoundingClientRect().height : layout[name];
  const set = (name, v) => { layout[name] = clamp(name, v); applyLayout(); };
  document.querySelectorAll("[data-gutter]").forEach((g) => {
    const name = g.dataset.gutter;
    let start = null;
    g.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      g.setPointerCapture(e.pointerId);
      g.classList.add("drag");
      start = { x: e.clientX, y: e.clientY, size: current(name) };
    });
    g.addEventListener("pointermove", (e) => {
      if (!start) return;
      const d = name === "graph" ? e.clientY - start.y : name === "left" ? e.clientX - start.x : start.x - e.clientX;
      set(name, start.size + d);
    });
    const end = () => { if (!start) return; start = null; g.classList.remove("drag"); saveLayout(); };
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
    g.addEventListener("dblclick", () => { layout[name] = DEFAULTS[name]; applyLayout(); saveLayout(); });
    g.addEventListener("keydown", (e) => {
      const grow = { left: ["ArrowRight", "ArrowLeft"], right: ["ArrowLeft", "ArrowRight"], graph: ["ArrowDown", "ArrowUp"] }[name];
      const step = e.key === grow[0] ? 20 : e.key === grow[1] ? -20 : 0;
      if (!step) return;
      e.preventDefault();
      set(name, current(name) + step);
      saveLayout();
    });
  });
  applyLayout();
})();

// ------------------------------------------------------------ value viewer

let viewing = null;
function openViewer(key) {
  const v = shown.get(key);
  if (!v) return;
  viewing = v;
  $("viewerTitle").textContent = `${v.label || "값"}  (${v.text.length.toLocaleString()}자)`;
  $("viewerBody").textContent = v.text;
  $("viewerCopy").textContent = "복사";
  $("viewer").hidden = false;
  $("viewerClose").focus();
}
function closeViewer() { $("viewer").hidden = true; viewing = null; }
$("viewerClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) closeViewer(); });
$("viewerCopy").addEventListener("click", async () => {
  if (!viewing) return;
  try { await navigator.clipboard.writeText(viewing.text); $("viewerCopy").textContent = "복사됨"; }
  catch { const r = document.createRange(); r.selectNodeContents($("viewerBody")); getSelection().removeAllRanges(); getSelection().addRange(r); $("viewerCopy").textContent = "선택됨, Ctrl+C"; }
});

// ------------------------------------------------------------ events

let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
setInterval(() => { const t = traces.get(selTrace); if (t && [...t.spans.values()].some((s) => s.status === "running")) schedule(); }, 250);

document.addEventListener("click", (e) => {
  if (zoom.dragged) { zoom.dragged = false; if (e.target.closest("#graphWrap")) { e.stopPropagation(); return; } }
  const zb = e.target.closest("[data-zoom]");
  if (zb) { zoomBy(zb.dataset.zoom); return; }
  const mb = e.target.closest("[data-max]");
  if (mb) { toggleMax(mb.dataset.max); return; }
  const cb = e.target.closest("[data-collapse]");
  if (cb) { toggleCollapse(cb.dataset.collapse); return; }
  const vb = e.target.closest("[data-view]");
  if (vb) { openViewer(vb.dataset.view); return; }
  const tr = e.target.closest("[data-trace]");
  if (tr) {
    selTrace = tr.dataset.trace; selSpan = null; $("follow").checked = false;
    if (isSummary(traces.get(selTrace))) selModule = "summary"; else if (selModule === "summary") selModule = "orchestrator";
    schedule(); return;
  }
  const ex = e.target.closest("[data-expand]");
  if (ex) { expanded.add(ex.dataset.expand); schedule(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; schedule(); return; }
  const node = e.target.closest(".node");
  if (node) { selModule = node.dataset.module; selSpan = null; schedule(); return; }
  const row = e.target.closest("[data-span]");
  if (row) { selModule = row.dataset.module; selSpan = row.dataset.span; schedule(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!$("viewer").hidden) { closeViewer(); return; }
    if (layout.max) { toggleMax(layout.max); return; }
  }
  const typing = e.target.closest && e.target.closest("input, textarea, [contenteditable]");
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && $("viewer").hidden) {
    if (e.key === "+" || e.key === "=") { zoomBy("in"); return; }
    if (e.key === "-" || e.key === "_") { zoomBy("out"); return; }
    if (e.key === "0") { zoomBy("fit"); return; }
  }
  const node = e.target.closest && e.target.closest(".node");
  if (node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selModule = node.dataset.module; selSpan = null; schedule(); }
});
$("clear").addEventListener("click", () => { clearedAt = Date.now(); traces = new Map(); selTrace = null; schedule(); });

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => {
    // The server replays its whole history on every connection.
    traces = new Map(); seen = new Set();
    $("conn").textContent = "연결됨"; $("conn").className = "pill on";
    schedule();
  };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (seen.has(ev.seq)) return;
    seen.add(ev.seq);
    apply(ev);
    schedule();
  };
  es.onerror = () => { $("conn").textContent = "앱 연결 끊김, 재연결 중"; $("conn").className = "pill off"; };
}
connect();
render();
</script>
</body>
