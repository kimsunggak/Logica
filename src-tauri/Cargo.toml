[package]
name = "logica"
version = "0.1.0"
description = "LOGICA: a local, AI-native LaTeX writing workspace"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "logica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "net", "io-util"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
# OS credential store: macOS Keychain, Windows Credential Manager, Linux Secret Service.
keyring = "4.2"
which = "8"
# Sign in with ChatGPT (OAuth 2.0 + PKCE)
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"
# Converting legacy-encoded sources (EUC-KR, Shift_JIS, Latin-1, ...) to UTF-8
encoding_rs = "0.8"
chardetng = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
