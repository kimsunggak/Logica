[package]
name = "logica"
version = "0.1.0"
description = "LOGICA: a local, AI-native LaTeX writing workspace"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "logica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
# OS credential store: macOS Keychain, Windows Credential Manager, Linux Secret Service.
keyring = "4.2"
which = "8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
